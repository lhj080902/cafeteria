# 모드 게임 테스트: 실제 게임을 가상 화면(xvfb)에 띄워서 모듈 동작을 검사한다.
# 개발 환경(runClientGameTest)과 배포용 jar(runProductionClientGameTest)를 따로 돌린다.
# Linux 에서 소프트웨어 렌더링으로 돌리므로 Windows 전용 동작은 여기서 확인되지 않는다.
name: 모드 게임 테스트

on:
  push:
    paths:
      - "mod/**"
      - ".github/workflows/gametest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gametest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gametest:
    name: ${{ matrix.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: runClientGameTest
            run_dir: clientGameTest
          - task: runProductionClientGameTest
            run_dir: productionClientGameTest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # xclip 은 스크린샷 복사 검사가 게임 밖에서 클립보드를 읽어 볼 때 쓴다.
      - name: 가상 화면과 그래픽 라이브러리 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth xclip libgl1-mesa-dri libglx-mesa0 \
            libxi6 libxrandr2 libxrender1 libxtst6 libxinerama1 libxcursor1 libxxf86vm1

      - name: 게임 테스트
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew ${{ matrix.task }} --console=plain 2>&1 | tee gametest-output.log

      # 테스트가 아예 돌지 않았는데 성공으로 끝나는 일을 막는다.
      - name: 모든 검사가 실제로 돌았는지 확인
        run: |
          grep -q "CAFETERIA GAMETEST: 모든 검사를 통과했습니다" gametest-output.log

      - name: 스크린샷과 로그 올리기
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.run_dir }}
          path: |
            mod/gametest-output.log
            mod/build/run/${{ matrix.run_dir }}/screenshots/
            mod/build/run/${{ matrix.run_dir }}/logs/
            mod/build/run/${{ matrix.run_dir }}/crash-reports/
          if-no-files-found: warn
          retention-days: 14
